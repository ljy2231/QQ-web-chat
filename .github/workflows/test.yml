name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements-linux-x86_64.lock
      - run: python -W error::SyntaxWarning -m compileall -q server.py webchat tools tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Frontend tests
        run: |
          for test in tests/test_frontend*.js; do
            if [ -f "$test" ]; then node "$test"; fi
          done
      - run: python tools/check_public_tree.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Validate Compose configuration
        env:
          WEB_PASSWORD: synthetic-ci-only
          NAPCAT_ACCESS_TOKEN: synthetic-ci-token
          PUBLIC_BASE_URL: https://example.invalid
        run: docker compose config --quiet
      - name: Build application image
        run: docker build -t qq-webchat:test .
