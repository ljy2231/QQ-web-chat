# Merge carefully into your existing TLS virtual host; do not replace certificates.
# Replace server_name and preserve your certificate paths. Only this service is proxied.
limit_req_zone $binary_remote_addr zone=webchat_login:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=webchat_connections:1m;
# Never log request_uri, query, Authorization, Cookie, or request bodies.
log_format webchat_safe '$remote_addr $request_method $uri $status $request_time';

server {
    listen 443 ssl;
    server_name example.com;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    access_log /var/log/nginx/webchat_access.log webchat_safe;
    client_max_body_size 52m;
    limit_conn webchat_connections 16;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/login {
        limit_req zone=webchat_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
