services:
  webchat:
    build: .
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      WEB_PASSWORD: ${WEB_PASSWORD:?请设置 WEB_PASSWORD}
      NAPCAT_ACCESS_TOKEN: ${NAPCAT_ACCESS_TOKEN:?请设置 NAPCAT_ACCESS_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?请设置 PUBLIC_BASE_URL}
      ADMIN_QQ_ID: ${ADMIN_QQ_ID:-}
      CHAT_DATA_DIR: /data
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - webchat-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  webchat-data:
